<form class="contact-form" name="contact" method="POST" action="/contact/thanks/" data-netlify="true" netlify-honeypot="bot-field" aria-label="Send me a message">
  <input type="hidden" name="form-name" value="contact">
  <p class="contact-form-honeypot" hidden>
    <label for="contact-bot-field">Leave this field empty</label>
    <input id="contact-bot-field" name="bot-field" type="text" tabindex="-1" autocomplete="off">
  </p>
  <div class="contact-form-field">
    <label for="contact-email">Your email</label>
    <input id="contact-email" name="email" type="email" autocomplete="email" maxlength="254" aria-describedby="contact-email-note" required>
    <p class="contact-form-note" id="contact-email-note">So I can write back to you.</p>
  </div>
  <div class="contact-form-field">
    <label for="contact-subject">Subject</label>
    <input id="contact-subject" name="subject" type="text" maxlength="200" required>
  </div>
  <div class="contact-form-field">
    <label for="contact-message">Message</label>
    <textarea id="contact-message" name="message" rows="5" maxlength="10000" required></textarea>
  </div>
  <button class="contact-form-submit" type="submit">Send message <span aria-hidden="true">→</span></button>
</form>
